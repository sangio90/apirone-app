events {}

http {
    # Senza questi due, nginx serve QUALSIASI file come text/plain: i PDF non si
    # aprono nel visualizzatore del browser e i download vengono segnalati come
    # sospetti, perché il tipo dichiarato non corrisponde all'estensione.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        location / {
            root /usr/share/nginx/html/public;
            autoindex on;  # opzionale, mostra elenco file
            add_header Access-Control-Allow-Origin *;
        }
    }
}